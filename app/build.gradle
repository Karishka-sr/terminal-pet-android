plugins {
    id 'com.android.application'
}

android {
    namespace 'com.terminalpet.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.terminalpet.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('PET_KEYSTORE') ?: '../keystore/terminal-pet.jks')
            storePassword System.getenv('PET_STORE_PASS') ?: 'terminalpet2026'
            keyAlias System.getenv('PET_KEY_ALIAS') ?: 'terminalpet'
            keyPassword System.getenv('PET_KEY_PASS') ?: 'terminalpet2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}